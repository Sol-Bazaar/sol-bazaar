services:
  postgres:
    image: postgres:16-alpine
    container_name: solbazaar_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: solbazaar
      POSTGRES_PASSWORD: solbazaar_dev_password
      POSTGRES_DB: solbazaar
    ports:
      - '5432:5432'
    volumes:
      - solbazaar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U solbazaar -d solbazaar']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: solbazaar_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - solbazaar_redisdata:/data
    command: redis-server --appendonly yes

volumes:
  solbazaar_pgdata:
  solbazaar_redisdata: